<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Preview</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050a10; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
  img  { width: 100%; display: block; border-radius: 18px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { color: #5ecba1; font: 700 10px/2 monospace; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
  <div><label>Hero Banner</label><img src="assets/hero.svg"/></div>
  <div><label>Experience</label><img src="assets/experience.svg"/></div>
  <div class="row">
    <div><label>FraudShield</label><img src="assets/card-fraudshield.svg"/></div>
    <div><label>TrustChain</label><img src="assets/card-trustchain.svg"/></div>
  </div>
  <div class="row">
    <div><label>DAGent</label><img src="assets/card-dagent.svg"/></div>
    <div><label>DriveMesh</label><img src="assets/card-drivemesh.svg"/></div>
  </div>
</body>
</html>
