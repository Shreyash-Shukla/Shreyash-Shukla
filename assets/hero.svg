<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>Shreyash Shukla — Software Engineer</title><desc>A self-contained engineering-themed banner with a restrained animated system flow.</desc>

<style>
@keyframes send {
  0% { opacity: 0; transform: translateX(0); }
  9% { opacity: 1; }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translateX(218px); }
}
@keyframes store {
  0%, 28% { opacity: 0; transform: translateY(0); }
  36%, 82% { opacity: 1; }
  100% { opacity: 0; transform: translateY(95px); }
}
.signal-h { opacity: 0; animation: send 6s linear infinite; }
.signal-v { opacity: 0; animation: store 6s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .signal-h, .signal-v { display: none; }
}
</style>

<rect width="1000" height="430" rx="18" fill="#0b1118"/>
<rect x="1" y="1" width="998" height="428" rx="17" fill="none" stroke="#2c3a43"/>
<path d="M40 68 H960 M40 365 H960" stroke="#2c3a43"/>
<path d="M532 68 V365" stroke="#2c3a43"/>
<rect x="40" y="42" width="8" height="8" rx="2" fill="#75e2b8"/>
<text x="58" y="50" font-size="13" font-weight="700" fill="#75e2b8">CODE IT. SHIP IT. IMPROVE IT.</text>
<text x="960" y="50" font-size="12" fill="#9baeb0" text-anchor="end">GANDHINAGAR, INDIA  ·  CSE '27</text>

<text x="48" y="157" font-size="18" letter-spacing="3" fill="#75e2b8">SOFTWARE ENGINEER</text>
