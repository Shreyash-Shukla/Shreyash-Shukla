</g>
<text x="47" y="392" font-size="13" fill="#9baeb0">CLOUD SYSTEMS  /  FULL-STACK PRODUCTS  /  APPLIED AI</text>

<rect x="555" y="91" width="405" height="250" rx="14" fill="#111a22" stroke="#2c3a43"/>
