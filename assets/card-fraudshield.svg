<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>FraudShield project</title><desc>A graph-based fraud detection project and HackNUthon winner.</desc>
<style>

@keyframes trace {
  0%   { opacity: 0; transform: translate(0, 0); }
  10%  { opacity: 1; transform: translate(0, 0); }
  22%  { transform: translate(20px, -16px); }
  33%  { transform: translate(55px, -44px); }
  50%  { transform: translate(90px, -18px); }
  66%  { transform: translate(124px, 8px); }
  78%  { transform: translate(100px, 36px); }
  88%  { opacity: 1; transform: translate(55px, 62px); }
  100% { opacity: 0; transform: translate(55px, 62px); }
}
@keyframes node-glow {
  0%, 100% { opacity: 0.35; }
  50%       { opacity: 1; }
}
.moving { opacity: 0; animation: trace 5.5s cubic-bezier(0.77, 0, 0.175, 1) 0.3s infinite; }
.node-active { animation: node-glow 5.5s cubic-bezier(0.77, 0, 0.175, 1) 0.3s infinite; }

/* Card title reveal: ease-out entrance, 400ms. Marketing budget. */
@keyframes title-in {
  0%   { opacity: 0; transform: translateY(8px); }
  50%  { opacity: 1; transform: translateY(-1px); }
  100% { opacity: 1; transform: translateY(0); }
}
.card-title { opacity: 0; animation: title-in 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.05s forwards; }
.card-kind  { opacity: 0; animation: title-in 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.13s forwards; }
@media (prefers-reduced-motion: reduce) {
  .moving { display: none; }
  .connector { animation: none; stroke-dashoffset: 0; opacity: 0.4; }
  .card-title, .card-kind { animation: none; opacity: 1; }
}
</style>
<rect width="490" height="250" rx="15" fill="#0b1118"/>
<rect x="1" y="1" width="488" height="248" rx="14" fill="none" stroke="#2c3a43"/>
<rect x="23" y="28" width="5" height="18" rx="2.5" fill="#75e2b8"/>
<text x="39" y="41" font-size="11" font-weight="700" fill="#75e2b8">01 / FEATURED PROJECT</text>
<text class="card-title" x="25" y="98" font-size="28" font-weight="800" fill="#edf4ef">FraudShield</text>
<text class="card-kind" x="25" y="125" font-size="12" fill="#9baeb0">Fraud detection across transactions</text>
<path d="M25 177 H465" stroke="#2c3a43"/>
<text x="25" y="209" font-size="11" fill="#75e2b8">FASTAPI  /  XGBOOST  /  GNN</text>
<text x="25" y="230" font-size="11" fill="#9baeb0">OPEN PROJECT ↗</text>

<path d="M294 126 L349 82 L418 134 L349 188 Z M294 126 L418 134 M349 82 V188"
      fill="none" stroke="#405a54" stroke-width="1.5"/>
<circle class="moving" cx="294" cy="126" r="5" fill="#75e2b8"/>
<g fill="#0b1118" stroke="#75e2b8" stroke-width="2">
  <circle cx="294" cy="126" r="12"/>
  <circle cx="349" cy="82"  r="12"/>
  <circle cx="418" cy="134" r="12"/>
  <circle cx="349" cy="188" r="12"/>
</g>
<circle class="node-active" cx="349" cy="82"  r="4" fill="#75e2b8"/>
<circle class="node-active" cx="418" cy="134" r="4" fill="#75e2b8" style="animation-delay: -1.8s;"/>
<text x="300" y="63" font-size="11" font-weight="700" fill="#75e2b8">GRAPH + MODEL</text>

</svg>
