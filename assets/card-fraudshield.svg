<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>FraudShield project</title><desc>A graph-based fraud detection project and HackNUthon winner.</desc>
<style>

@keyframes trace {
  0% { opacity: 0; transform: translate(0,0); }
  10% { opacity: 1; }
  33% { transform: translate(55px,-44px); }
  66% { transform: translate(124px,8px); }
  88% { opacity: 1; }
  100% { opacity: 0; transform: translate(55px,62px); }
}
.moving { opacity: 0; animation: trace 6s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .moving { display: none; }
  .verify { animation: none; opacity: .88; }
}
</style>
