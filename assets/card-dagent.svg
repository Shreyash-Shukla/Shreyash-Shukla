<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>DAGent project</title><desc>A directed workflow for coordinating AI agents and MCP tools.</desc>
<style>

@keyframes route {
  0%   { opacity: 0; transform: translate(0, 0); }
  12%  { opacity: 1; transform: translate(0, 0); }
  25%  { transform: translate(25px, -18px); }
  40%  { transform: translate(61px, -42px); }
  57%  { transform: translate(96px, -18px); }
  75%  { transform: translate(131px, 0); opacity: 1; }
  90%  { opacity: 0.2; }
  100% { transform: translate(131px, 0); opacity: 0; }
}
@keyframes task-active {
  0%, 100% { transform: scale(1); opacity: 0.45; }
  50%       { transform: scale(1.18); opacity: 1; }
}
.moving      { opacity: 0; animation: route 5.5s cubic-bezier(0.77, 0, 0.175, 1) 0.4s infinite; }
.active-node { animation: task-active 5.5s cubic-bezier(0.77, 0, 0.175, 1) 0.4s infinite;
               transform-origin: 353px 86px; }

/* Card title reveal: ease-out entrance, 400ms. Marketing budget. */
@keyframes title-in {
  0%   { opacity: 0; transform: translateY(8px); }
  50%  { opacity: 1; transform: translateY(-1px); }
  100% { opacity: 1; transform: translateY(0); }
}
.card-title { opacity: 0; animation: title-in 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.05s forwards; }
.card-kind  { opacity: 0; animation: title-in 0.4s cubic-bezier(0.23, 1, 0.32, 1) 0.13s forwards; }
@media (prefers-reduced-motion: reduce) {
  .moving { display: none; }
  .connector { animation: none; stroke-dashoffset: 0; opacity: 0.4; }
  .card-title, .card-kind { animation: none; opacity: 1; }
}
</style>
<rect width="490" height="250" rx="15" fill="#0b1118"/>
<rect x="1" y="1" width="488" height="248" rx="14" fill="none" stroke="#2c3a43"/>
<rect x="23" y="28" width="5" height="18" rx="2.5" fill="#b9adff"/>
<text x="39" y="41" font-size="11" font-weight="700" fill="#b9adff">03 / FEATURED PROJECT</text>
<text class="card-title" x="25" y="98" font-size="28" font-weight="800" fill="#edf4ef">DAGent</text>
<text class="card-kind" x="25" y="125" font-size="12" fill="#9baeb0">Agent workflow orchestration</text>
<path d="M25 177 H465" stroke="#2c3a43"/>
<text x="25" y="209" font-size="11" fill="#b9adff">NEXT.JS  /  TYPESCRIPT  /  MCP</text>
<text x="25" y="230" font-size="11" fill="#9baeb0">OPEN PROJECT ↗</text>

<path d="M292 128 L353 86 L423 128 L353 170 Z M353 86 V170"
      fill="none" stroke="#514b71" stroke-width="1.5"/>
<circle class="moving" cx="292" cy="128" r="5" fill="#b9adff"/>
<g fill="#0b1118" stroke="#b9adff" stroke-width="2">
  <circle cx="292" cy="128" r="13"/>
  <circle cx="353" cy="86"  r="13"/>
  <circle cx="353" cy="170" r="13"/>
  <circle cx="423" cy="128" r="13"/>
</g>
<g fill="#b9adff" font-size="12" font-weight="700" text-anchor="middle">
  <text x="292" y="132">1</text>
  <text class="active-node" x="353" y="90">2</text>
  <text x="353" y="174">3</text>
  <text x="423" y="132">4</text>
</g>

</svg>
