<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>DAGent project</title><desc>Token routes through DAG nodes with eased movement. Active node pulses.</desc>
<style>

@keyframes route {
  0%   { opacity:0; transform: translate(0,0); }
  11%  { opacity:1; transform: translate(0,0); }
  /* Edge 1 → node 2 (ease-in-out) */
  24%  { transform: translate(24px,-18px); }
  40%  { transform: translate(61px,-42px); }
  /* Edge 2 → node 4 (ease-in-out) */
  56%  { transform: translate(95px,-18px); }
  72%  { transform: translate(131px,0); opacity:1; }
  90%  { opacity:0.2; }
  100% { transform: translate(131px,0); opacity:0; }
}
@keyframes ta {
  0%,100% { transform: scale(1); opacity:0.4; }
  50%      { transform: scale(1.2); opacity:1; }
}
.moving      { opacity:0; animation: route 5.2s cubic-bezier(0.77,0,0.175,1) 0.4s infinite; }
.active-node { animation: ta 5.2s cubic-bezier(0.77,0,0.175,1) 0.4s infinite;
               transform-origin: 353px 86px; }

/* Title + subtitle: staggered ease-out reveal */
@keyframes ti {
  0%   { opacity:0; transform: translateY(7px); }
  100% { opacity:1; transform: translateY(0); }
}
.ct { opacity:0; animation: ti 0.38s cubic-bezier(0.23,1,0.32,1) 0.06s forwards; }
.ck { opacity:0; animation: ti 0.38s cubic-bezier(0.23,1,0.32,1) 0.14s forwards; }
@media (prefers-reduced-motion: reduce) {
  .moving,.flow { display: none; }
  .ldr { animation: none; stroke-dashoffset: 0; opacity: 0.4; }
  .ct,.ck { animation: none; opacity: 1; }
}
</style>

<defs>
  <pattern id="cdots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="0.5" cy="0.5" r="0.7" fill="#1e2d3d" opacity="0.5"/>
  </pattern>
</defs>

<rect width="490" height="250" rx="15" fill="#080e15"/>
<rect width="490" height="250" rx="15" fill="url(#cdots)"/>
<rect x="1" y="1" width="488" height="248" rx="14" fill="none" stroke="#1e2d3d" stroke-width="1.5"/>

<!-- accent bar -->
<rect x="22" y="26" width="4" height="20" rx="2" fill="#8b7cf6"/>
<text x="36" y="40" font-size="9" font-weight="700" fill="#8b7cf6" letter-spacing="2">03 / FEATURED PROJECT</text>

<text class="ct" x="22" y="95" font-size="26" font-weight="800" fill="#dce8f0">DAGent</text>
<text class="ck" x="22" y="118" font-size="11" fill="#5a7282">Agent workflow orchestration</text>
<path d="M22 172 H468" stroke="#1e2d3d" stroke-width="1"/>
<text x="22" y="203" font-size="10" fill="#8b7cf6" letter-spacing="1">NEXT.JS  ·  TYPESCRIPT  ·  MCP</text>
<text x="22" y="224" font-size="10" fill="#5a7282">OPEN PROJECT ↗</text>

<path d="M292 128 L353 86 L423 128 L353 170 Z M353 86 V170"
      fill="none" stroke="#1e2d3d" stroke-width="2"/>
<circle class="moving" cx="292" cy="128" r="5" fill="#8b7cf6"/>
<g fill="#080e15" stroke="#8b7cf6" stroke-width="2">
  <circle cx="292" cy="128" r="13"/>
  <circle cx="353" cy="86"  r="13"/>
  <circle cx="353" cy="170" r="13"/>
  <circle cx="423" cy="128" r="13"/>
</g>
<g fill="#8b7cf6" font-size="11" font-weight="700" text-anchor="middle">
  <text x="292" y="132">1</text>
  <text class="active-node" x="353" y="90">2</text>
  <text x="353" y="174">3</text>
  <text x="423" y="132">4</text>
</g>

</svg>
