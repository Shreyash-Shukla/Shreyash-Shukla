<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>DriveMesh project</title><desc>Flowing dashes stream from ENC to storage nodes — constant replication.</desc>
<style>

/* Constant replication stream — linear is correct (marquee/data flow case). */
@keyframes rh1 { from { stroke-dashoffset: 44; } to { stroke-dashoffset: -94; } }
@keyframes rh2 { from { stroke-dashoffset: 44; } to { stroke-dashoffset: -94; } }
.flow1 { animation: rh1 2s linear 0.3s infinite; }
.flow2 { animation: rh2 2s linear -1.0s infinite; }
/* ENC box: subtle beat indicating active encryption */
@keyframes enc-pulse {
  0%,100% { opacity: 0.7; }
  50%      { opacity: 1; }
}
.enc { animation: enc-pulse 2s cubic-bezier(0.77,0,0.175,1) infinite; }

/* Title + subtitle: staggered ease-out reveal */
@keyframes ti {
  0%   { opacity:0; transform: translateY(7px); }
  100% { opacity:1; transform: translateY(0); }
}
.ct { opacity:0; animation: ti 0.38s cubic-bezier(0.23,1,0.32,1) 0.06s forwards; }
.ck { opacity:0; animation: ti 0.38s cubic-bezier(0.23,1,0.32,1) 0.14s forwards; }
@media (prefers-reduced-motion: reduce) {
  .moving,.flow { display: none; }
  .ldr { animation: none; stroke-dashoffset: 0; opacity: 0.4; }
  .ct,.ck { animation: none; opacity: 1; }
}
</style>

<defs>
  <pattern id="cdots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="0.5" cy="0.5" r="0.7" fill="#1e2d3d" opacity="0.5"/>
  </pattern>
</defs>

<rect width="490" height="250" rx="15" fill="#080e15"/>
<rect width="490" height="250" rx="15" fill="url(#cdots)"/>
<rect x="1" y="1" width="488" height="248" rx="14" fill="none" stroke="#1e2d3d" stroke-width="1.5"/>

<!-- accent bar -->
<rect x="22" y="26" width="4" height="20" rx="2" fill="#4fa3c7"/>
<text x="36" y="40" font-size="9" font-weight="700" fill="#4fa3c7" letter-spacing="2">04 / FEATURED PROJECT</text>

<text class="ct" x="22" y="95" font-size="26" font-weight="800" fill="#dce8f0">DriveMesh</text>
<text class="ck" x="22" y="118" font-size="11" fill="#5a7282">Encrypted distributed storage</text>
<path d="M22 172 H468" stroke="#1e2d3d" stroke-width="1"/>
<text x="22" y="203" font-size="10" fill="#4fa3c7" letter-spacing="1">PYTHON  ·  FLASK  ·  FERNET</text>
<text x="22" y="224" font-size="10" fill="#5a7282">OPEN PROJECT ↗</text>

<path d="M319 90 H413 M319 159 H413" stroke="#1e2d3d" stroke-width="2"/>
<path d="M407 86 L413 90 L407 94 M407 155 L413 159 L407 163"
      fill="none" stroke="#4fa3c7" stroke-width="2"/>
<!-- Flowing dashes on both paths -->
<path class="flow1" d="M319 90 H413" fill="none" stroke="#4fa3c7" stroke-width="2"
      stroke-dasharray="18 26" stroke-dashoffset="44" opacity="0.8"/>
<path class="flow2" d="M319 159 H413" fill="none" stroke="#4fa3c7" stroke-width="2"
      stroke-dasharray="18 26" stroke-dashoffset="44" opacity="0.8"/>
<!-- Nodes -->
<g fill="#080e15" stroke="#4fa3c7" stroke-width="2">
  <rect class="enc" x="278" y="105" width="49" height="39" rx="7"/>
  <rect x="412" y="72"  width="45" height="36" rx="7"/>
  <rect x="412" y="141" width="45" height="36" rx="7"/>
</g>
<g fill="#4fa3c7" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">
  <text x="302" y="129">ENC</text>
  <text x="434" y="95">N1</text>
  <text x="434" y="164">N2</text>
</g>

</svg>
