<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 382" width="490" height="382" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace">
<defs><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="cc"><rect width="490" height="382" rx="16"/></clipPath><radialGradient id="amb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffa94d" stop-opacity=".28"/><stop offset="1" stop-color="#ffa94d" stop-opacity="0"/></radialGradient></defs>
<rect width="490" height="382" rx="16" fill="#0d1020"/><g clip-path="url(#cc)"><circle cx="450" cy="30" r="110" fill="url(#amb)"><animate attributeName="opacity" values=".5;1;.5" dur="5s" repeatCount="indefinite"/></circle></g><rect x="24" y="20" width="160.5" height="24" rx="12" fill="#ffa94d" fill-opacity=".15" stroke="#ffa94d" stroke-opacity=".7"/><text x="104.2" y="36" font-size="11" fill="#ffa94d" text-anchor="middle" font-weight="bold">● DISTRIBUTED SYSTEMS</text><text x="466" y="37" font-size="11" fill="#4b5275" text-anchor="end">PROJECT_04</text><text x="24" y="86" font-size="32" font-weight="800" fill="#fff">DriveMesh</text><text x="24" y="108" font-size="12" fill="#8b93b8">Distributed Encrypted Cloud Storage</text><text x="24" y="238" font-size="12" fill="#c3c9e8" xml:space="preserve">Aggregates multiple Google Drive accounts into unified</text><text x="24" y="255" font-size="12" fill="#c3c9e8" xml:space="preserve">encrypted storage. Splits files into 5MB blocks encrypted</text><text x="24" y="272" font-size="12" fill="#c3c9e8" xml:space="preserve">with Fernet and distributes them round-robin via</text><text x="24" y="289" font-size="12" fill="#c3c9e8" xml:space="preserve">ThreadPoolExecutor with multi-account OAuth 2.0 token</text><text x="24" y="306" font-size="12" fill="#c3c9e8" xml:space="preserve">refresh.</text><rect x="24.0" y="336" width="59.6" height="22" rx="11.0" fill="#ffa94d" fill-opacity=".12" stroke="#ffa94d" stroke-opacity=".55"/><text x="53.8" y="351.0" font-size="11" fill="#e6e9ff" text-anchor="middle">Python</text><rect x="91.6" y="336" width="53.0" height="22" rx="11.0" fill="#ffa94d" fill-opacity=".12" stroke="#ffa94d" stroke-opacity=".55"/><text x="118.1" y="351.0" font-size="11" fill="#e6e9ff" text-anchor="middle">Flask</text><rect x="152.6" y="336" width="86.0" height="22" rx="11.0" fill="#ffa94d" fill-opacity=".12" stroke="#ffa94d" stroke-opacity=".55"/><text x="195.6" y="351.0" font-size="11" fill="#e6e9ff" text-anchor="middle">GDrive API</text><rect x="246.6" y="336" width="59.6" height="22" rx="11.0" fill="#ffa94d" fill-opacity=".12" stroke="#ffa94d" stroke-opacity=".55"/><text x="276.4" y="351.0" font-size="11" fill="#e6e9ff" text-anchor="middle">Fernet</text><rect x="314.2" y="336" width="79.4" height="22" rx="11.0" fill="#ffa94d" fill-opacity=".12" stroke="#ffa94d" stroke-opacity=".55"/><text x="353.9" y="351.0" font-size="11" fill="#e6e9ff" text-anchor="middle">OAuth 2.0</text><rect x="1.5" y="1.5" width="487" height="379" rx="15" fill="none" stroke="#ffa94d" stroke-opacity=".8" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-32" dur="3s" repeatCount="indefinite"/></rect><path d="M76.0 168 L98.0 168" stroke="#ffa94d" stroke-opacity=".35" stroke-width="1.5" fill="none"/><circle r="4" fill="#ffa94d" filter="url(#glow)" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" path="M76.0 168 L98.0 168" keyPoints="0;0;1;1" keyTimes="0;0.020;0.160;1" calcMode="linear"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.020;0.022;0.150;0.160;1"/></circle><path d="M178.0 168 L200.0 168" stroke="#ffa94d" stroke-opacity=".35" stroke-width="1.5" fill="none"/><circle r="4" fill="#ffa94d" filter="url(#glow)" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" path="M178.0 168 L200.0 168" keyPoints="0;0;1;1" keyTimes="0;0.160;0.300;1" calcMode="linear"/><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.160;0.162;0.290;0.300;1"/></circle><path d="M264.0 168 C287.0 168 287.0 135 310.0 135" stroke="#ffa94d" stroke-opacity=".35" stroke-width="1.5" fill="none"/><circle r="4" fill="#ffa94d" filter="url(#glow)" opacity="0"><animateMotion dur="6s" repeatCount="indefinite" path="M264.0 168 C287.0 168 287.0 135 310.0 135" keyPoints="0;0;1;1" keyTimes="0;0.300;0.430;1" calcMode="linear"/><animate attributeName="opacity" dur="