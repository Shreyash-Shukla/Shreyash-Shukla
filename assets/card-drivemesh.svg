<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><title>DriveMesh project</title><desc>Encrypted data replicated across storage nodes.</desc>
<style>

@keyframes replicate {
  0%, 18% { opacity: 0; transform: translateX(0); }
  30% { opacity: 1; }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(95px); }
}
.moving { opacity: 0; animation: replicate 5.5s linear infinite; }

@media (prefers-reduced-motion: reduce) {
  .moving { display: none; }
  .verify { animation: none; opacity: .88; }
}
</style>
